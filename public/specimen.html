<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeuroMechFly · FlyCo Robinhood specimen</title><style>body{margin:0;background:#16191b;color:#eee5ce;font:14px system-ui}canvas{display:block}header{position:fixed;top:28px;left:32px}h1{font-weight:400;font-size:30px;margin:8px 0}p{color:#a6a9a7;max-width:480px;line-height:1.6}footer{position:fixed;bottom:24px;left:32px;right:32px;display:flex;gap:24px;flex-wrap:wrap}a{color:#e4bf64}button{background:#e4bf64;border:0;padding:12px 20px;border-radius:20px;cursor:pointer}#status{color:#d6b75a}</style><script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script></head><body><header><a href="/">← Return to FlyCo Robinhood</a><h1>The original specimen</h1><p>NeuroMechFly v2 · EPFL<br>Original anatomical meshes, shared by all six agents<br>Kinematic replay of FlyGym step tables · Not neural emulation</p><div id="status">Loading original anatomy</div></header><footer><button id="motion">Pause joint replay</button><a href="https://neuromechfly.org/" target="_blank" rel="noopener">Scientific source ↗</a><a href="/licenses/NeuroMechFly-Apache-2.0.txt">Apache-2.0 license</a></footer><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {loadFlyModel} from './fly-model.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#16191b');
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.01,100);camera.position.set(2.5,1.8,3.3);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.35,0);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight('#f4e9ca','#635742',2.7));const light=new THREE.DirectionalLight('#fff3d4',4);light.position.set(2,5,3);light.castShadow=true;light.shadow.mapSize.set(2048,2048);scene.add(light);const rim=new THREE.DirectionalLight('#9ac6ce',2);rim.position.set(-3,2,-2);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#222628',roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.y=-.015;floor.receiveShadow=true;scene.add(floor);
let moving=true;document.querySelector('#motion').onclick=e=>{moving=!moving;e.target.textContent=moving?'Pause joint replay':'Play joint replay';};
try{const model=await loadFlyModel();const fly=model.createFly();scene.add(fly);window.specimen={fly,scene,camera};document.querySelector('#status').textContent='69 anatomical pieces · drag to orbit · scroll to zoom';let t=0;const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{t+=Math.min(clock.getDelta(),.05);model.animateFly(fly,t,moving);controls.update();renderer.render(scene,camera);});}catch(e){document.querySelector('#status').textContent='Model load failed: '+e.message;}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
